<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#d9e9e9"><title>L'Horizon vivant — Prototype 0.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8e8e9;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}#ui{position:absolute;inset:0;pointer-events:none;color:#405c68}#brand{position:absolute;top:max(30px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.62}#hint{position:absolute;bottom:max(42px,env(safe-area-inset-bottom) + 24px);left:24px;right:24px;text-align:center;font-size:12px;letter-spacing:.13em;opacity:.7;transition:opacity 1s}#sound{position:absolute;right:18px;top:max(24px,env(safe-area-inset-top));pointer-events:auto;border:1px solid #ffffff80;border-radius:30px;padding:10px 13px;background:#ffffff50;color:#42636a;backdrop-filter:blur(8px);font-size:12px}#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 40%,#d9e7e730 100%)}@media(prefers-reduced-motion:reduce){#hint{transition:none}}</style></head><body><canvas id="c"></canvas><div id="veil"></div><div id="ui"><div id="brand">L'Horizon vivant · 0.1</div><div id="hint">Glisse vers le haut pour découvrir · vers le bas pour revenir</div><button id="sound" aria-label="Activer ou couper l'ambiance sonore">♪ Son : off</button></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),hint=document.getElementById('hint');let w=0,h=0,dpr=1,progress=0,target=0,t=0,dragY=null,dragStart=0,playing=false,audio=null;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function frame(ms){const dt=Math.min(.04,(ms-t)/1000||.016);t=ms;progress+=(target-progress)*(reduce?1:Math.min(1,dt*2.1));const p=progress,slow=reduce?0:ms*.001;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,p>.3?'#a8c5d7':'#cbdce4');sky.addColorStop(.45,p>.3?'#c5d7de':'#e6e9e8');sky.addColorStop(.63,'#f9e8d6');sky.addColorStop(1,'#a9cdd1');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
const horizon=h*(.55+p*.07),cx=w*.5;let glow=ctx.createRadialGradient(cx,horizon,2,cx,horizon,w*.8);glow.addColorStop(0,`rgba(255,250,230,${.95-p*.15})`);glow.addColorStop(.22,'rgba(255,239,209,.38)');glow.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
// Floating distant rings, revealed by the journey.
const reveal=Math.max(0,(p-.12)/.88);ctx.save();ctx.translate(cx,horizon-h*.12*reveal);for(let i=4;i>=0;i--){const scale=(.17+i*.145)*Math.min(w,h)*(.7+reveal*.85);const sway=Math.sin(slow*.22+i*.7)*3;ctx.beginPath();ctx.ellipse(sway,-reveal*h*.055,scale*.45,scale*.87,Math.sin(i)*.06,0,Math.PI*2);ctx.strokeStyle=`rgba(${i%2?'255,251,239':'196,231,231'},${reveal*(.12+(4-i)*.095)})`;ctx.lineWidth=1.4+i*.5;ctx.shadowBlur=14;ctx.shadowColor='#fff9e8';ctx.stroke()}ctx.restore();
// Mirrored sea and soft ripples.
let sea=ctx.createLinearGradient(0,horizon,0,h);sea.addColorStop(0,'rgba(235,249,246,.22)');sea.addColorStop(1,'rgba(101,171,185,.34)');ctx.fillStyle=sea;ctx.fillRect(0,horizon,w,h-horizon);for(let i=0;i<52;i++){const depth=(i+1)/53,y=horizon+Math.pow(depth,1.65)*(h-horizon),width=(9+depth*widthFactor())*(.5+.5*Math.sin(i*3.1+slow*.32)),x=cx+Math.sin(i*15.6+slow*.14)*w*.3*depth;ctx.fillStyle=`rgba(255,255,245,${(.06+depth*.12)*(1-p*.25)})`;ctx.fillRect(x-width/2,y,width,Math.max(.5,depth*1.5))}
// Quiet lights emerge without demanding attention.
for(let i=0;i<38;i++){const seed=i*12.9898,xx=(Math.sin(seed)*43758.5453)%1,yy=(Math.sin(seed*2.1)*13579.4)%1,x=(xx<0?xx+1:xx)*w,y=(yy<0?yy+1:yy)*h*.76,alpha=(.08+.45*reveal)*(reduce?.7:(.6+.4*Math.sin(slow*.55+i)));circle(x,y,1+(i%4)*.45,`rgba(255,255,247,${alpha})`)}
if(p>.72){const a=(p-.72)/.28;ctx.textAlign='center';ctx.font='300 14px -apple-system, sans-serif';ctx.fillStyle=`rgba(59,93,105,${a*.65})`;ctx.fillText('Il y a encore tant à découvrir.',cx,h*.82)}requestAnimationFrame(frame)}function widthFactor(){return Math.min(w*.45,180)}requestAnimationFrame(frame);
function start(y){dragY=y;dragStart=target}function move(y){if(dragY===null)return;target=Math.max(0,Math.min(1,dragStart+(dragY-y)/(h*.65)));hint.style.opacity=target>.18?'.18':'.7'}function end(){dragY=null}canvas.addEventListener('touchstart',e=>{start(e.touches[0].clientY)},{passive:true});canvas.addEventListener('touchmove',e=>{move(e.touches[0].clientY)},{passive:true});canvas.addEventListener('touchend',end);canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){start(e.clientY);canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')move(e.clientY)});canvas.addEventListener('pointerup',end);addEventListener('keydown',e=>{if(e.key==='ArrowUp')target=Math.min(1,target+.2);if(e.key==='ArrowDown')target=Math.max(0,target-.2)});
// Optional original ambient sound, synthesized locally; off by default.
document.getElementById('sound').addEventListener('click',async()=>{const b=document.getElementById('sound');if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){b.textContent='Son indisponible';return}const ac=new AC(),osc1=ac.createOscillator(),osc2=ac.createOscillator(),gain=ac.createGain();osc1.type='sine';osc2.type='sine';osc1.frequency.value=110;osc2.frequency.value=164.81;gain.gain.value=.012;osc1.connect(gain);osc2.connect(gain);gain.connect(ac.destination);osc1.start();osc2.start();audio={ac,gain}}await audio.ac.resume();playing=!playing;audio.gain.gain.setTargetAtTime(playing?.012:0,audio.ac.currentTime,.5);b.textContent=playing?'♪ Son : on':'♪ Son : off'});
</script></body></html>
